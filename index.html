<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>매너노트</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-wrapper">
    <!-- 상단 네비게이션 -->
    <header class="top-nav">
      <button class="back-btn" id="backBtn" onclick="goHome()">← 뒤로</button>
      <h1 class="brand-title" id="pageTitle">매너노트</h1>
      <div style="width: 32px;"></div>
    </header>

    <!-- [1단계] 홈 화면: 초간결 미니멀 모드 -->
    <main id="homeView">
      <div class="home-banner">
        <span class="banner-badge">3초 예절 치트키</span>
        <h2 class="banner-headline">헷갈리는 순간,<br>바로 확인하세요</h2>
      </div>

      <div class="category-container">
        <div class="cat-tile" onclick="openCategory('경조사')">
          <span class="cat-icon">🕊️</span>
          <div>
            <div class="cat-name">경조사</div>
            <div class="cat-sub">장례·결혼·돌잔치</div>
          </div>
        </div>
        <div class="cat-tile" onclick="openCategory('비즈니스')">
          <span class="cat-icon">💼</span>
          <div>
            <div class="cat-name">비즈니스</div>
            <div class="cat-sub">미팅·명함·메일</div>
          </div>
        </div>
        <div class="cat-tile" onclick="openCategory('식사·회식')">
          <span class="cat-icon">🍽️</span>
          <div>
            <div class="cat-name">식사·회식</div>
            <div class="cat-sub">상석·건배·상견례</div>
          </div>
        </div>
        <div class="cat-tile" onclick="openCategory('일상·이웃')">
          <span class="cat-icon">🏘️</span>
          <div>
            <div class="cat-name">일상·이웃</div>
            <div class="cat-sub">엘리베이터·소음</div>
          </div>
        </div>
      </div>
    </main>

    <!-- [2단계] 세부 카테고리 & 키워드 화면 -->
    <section id="detailView" class="detail-view">
      <!-- 상황 칩 가로 스크롤 -->
      <div class="situation-scroll" id="situationChips"></div>

      <!-- 세부 키워드 그리드 -->
      <div class="keyword-section-title">핵심 예절 선택</div>
      <div class="keyword-grid" id="keywordGrid"></div>
    </section>

    <!-- [3단계] 하단 팝업 (바텀시트) -->
    <div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet()"></div>
    <div class="bottom-sheet" id="bottomSheet">
      <div class="sheet-handle"></div>
      <div class="sheet-badge" id="sheetBadge"></div>
      <h3 class="sheet-title" id="sheetTitle"></h3>
      
      <div class="sheet-core-box" id="sheetCore"></div>
      
      <div class="sheet-why-box">
        <div class="sheet-why-title">💡 왜 이렇게 해야 할까요?</div>
        <div id="sheetWhy"></div>
      </div>

      <button class="sheet-close-btn" onclick="closeSheet()">확인했습니다</button>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
